# opencode-mcp — izole MCP sunucusu.
# n8n_default ağına katılır; n8n konteyneri http://opencode-mcp:8790/mcp üzerinden erişir.
# Upstream OpenCode: izole opencode-agent konteyneri (http://opencode-agent:4096).
services:
  opencode-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: opencode-mcp:local
    container_name: opencode-mcp
    restart: unless-stopped
    environment:
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://opencode-agent:4096}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8790
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_TOOL_PROFILE=${MCP_TOOL_PROFILE:-essential}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
    networks:
      - n8n_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n_default:
    external: true
    name: n8n_default
